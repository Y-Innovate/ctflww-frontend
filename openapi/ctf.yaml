components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Player token from POST /token, or OBO token for admins
  schemas:
    announceBody:
      type: string
      minLength: 0
      maxLength: 1000
      description: Text
    announceID:
      type: integer
      description: Key
    announceTitle:
      type: string
      minLength: 0
      maxLength: 100
      description: Title
    attemptsLeft:
      type: integer
      description: Wrong attempts left; -1 = no limit
    awardID:
      type: integer
      description: Key
    captainID:
      type: integer
      description: Captain
    caseSensitive:
      type: string
      minLength: 0
      maxLength: 1
      description: Y or N
    category:
      type: string
      minLength: 0
      maxLength: 8
      description: Key in CATEGORY
    categoryName:
      type: string
      minLength: 0
      maxLength: 255
      description: Category description
    challengeDescription:
      type: string
      minLength: 0
      maxLength: 3000
      description: Text shown to players
    challengeID:
      type: integer
      description: Key
    challengeTitle:
      type: string
      minLength: 0
      maxLength: 100
      description: Title
    challengeType:
      type: string
      minLength: 0
      maxLength: 1
      description: S static; only value in v1
    claimExpires:
      type: string
      minLength: 0
      maxLength: 26
      description: After this, S4 expires the account
      example: 2026-01-01-00.00.00.000000
    claimToken:
      type: string
      minLength: 0
      maxLength: 64
      description: One-time claim token; shown once, never stored
    completedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Finished
      example: 2026-01-01-00.00.00.000000
    cost:
      type: integer
      description: Points deducted
    createdBy:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid (or batch userid)
    createdDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Set by DB2
      example: 2026-01-01-00.00.00.000000
    currentPassphrase:
      type: string
      minLength: 0
      maxLength: 100
      description: Current RACF passphrase; never logged or stored
    currentPoints:
      type: integer
      description: Current value of the challenge
    decaySolves:
      type: integer
      description: 'Dynamic only: decay, > 0'
    displayName:
      type: string
      minLength: 0
      maxLength: 30
      description: Name as typed
    endTS:
      type: string
      minLength: 0
      maxLength: 26
      description: End
      example: 2026-01-01-00.00.00.000000
    eventDescription:
      type: string
      minLength: 0
      maxLength: 1000
      description: Public description
    eventID:
      type: integer
      description: Key
    eventName:
      type: string
      minLength: 0
      maxLength: 100
      description: Name
    eventStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: D draft, P published, C closed
    flag:
      type: string
      minLength: 0
      maxLength: 255
      description: The submitted text
    flagID:
      type: integer
      description: Key
    flagValue:
      type: string
      minLength: 0
      maxLength: 255
      description: The flag
    freezeTS:
      type: string
      minLength: 0
      maxLength: 26
      description: Freeze; NULL = none or lifted
      example: 2026-01-01-00.00.00.000000
    hintCount:
      type: integer
      description: Hints unlocked
    hintID:
      type: integer
      description: Key
    hintText:
      type: string
      minLength: 0
      maxLength: 1000
      description: Hidden until unlocked
    infoMessage:
      type: string
      minLength: 0
      maxLength: 72
      description: Result text
    initPoints:
      type: integer
      description: Value, or initial value if dynamic
    isCaptain:
      type: string
      minLength: 0
      maxLength: 1
      description: Y if this player is captain
    isCorrect:
      type: string
      minLength: 0
      maxLength: 1
      description: Y or N
    isFrozen:
      type: string
      minLength: 0
      maxLength: 1
      description: Y if later scores are left out
    isLocked:
      type: string
      minLength: 0
      maxLength: 1
      description: Y if prerequisites are missing
    isSolved:
      type: string
      minLength: 0
      maxLength: 1
      description: Y if the team solved it
    isUnlocked:
      type: string
      minLength: 0
      maxLength: 1
      description: Y if the team unlocked it
    isVisible:
      type: string
      minLength: 0
      maxLength: 1
      description: Y or N
    jesJobID:
      type: string
      minLength: 0
      maxLength: 8
      description: JES job ID, if known
    jobMessage:
      type: string
      minLength: 0
      maxLength: 72
      description: Result text
    jobRC:
      type: integer
      description: Return code
    jobStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: N new, Q queued for the batch, S submitted, D done, F failed
    joinCode:
      type: string
      minLength: 0
      maxLength: 12
      description: Generated join code; never public
    linkID:
      type: integer
      description: Key
    linkName:
      type: string
      minLength: 0
      maxLength: 60
      description: Text shown
    linkUrl:
      type: string
      minLength: 0
      maxLength: 500
      description: URL
    maxAttempts:
      type: integer
      description: Wrong attempts per team; NULL = no limit
    maxPlayers:
      type: integer
      description: Cap on places
    maxTeamSize:
      type: integer
      description: 1 in individual mode
    memberCount:
      type: integer
      description: Members, for the size check
    minPoints:
      type: integer
      description: 'Dynamic only: lowest value'
    name:
      type: string
      minLength: 0
      maxLength: 20
      description: Name from the RACF profile
    newPassphrase:
      type: string
      minLength: 0
      maxLength: 100
      description: New RACF passphrase; never logged or stored
    partStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: P pending (waiting for a job), A active
    passphrase:
      type: string
      minLength: 0
      maxLength: 100
      description: New RACF passphrase; never logged or stored
    password:
      type: string
      minLength: 0
      maxLength: 100
      description: RACF passphrase; never logged or stored
    phase:
      type: string
      minLength: 0
      maxLength: 1
      description: U upcoming, R running, F frozen, E ended; empty unless published
    playMode:
      type: string
      minLength: 0
      maxLength: 1
      description: I individual, T team
    playerCount:
      type: integer
      description: Places taken, including pending
    playerID:
      type: integer
      description: Key; also the registration ID
    playerStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: P pending, R ready, A active, F failed, V revoked, X deleted
    points:
      type: integer
      description: Not zero
    provAction:
      type: string
      minLength: 0
      maxLength: 1
      description: C create, N connect, M remove, P reset, V revoke, U resume, X delete
    provJobID:
      type: integer
      description: Key; also encoded in the job name
    racfGroup:
      type: string
      minLength: 0
      maxLength: 8
      description: Extra RACF group, from RACFGRP; admin only
    racfUserid:
      type: string
      minLength: 0
      maxLength: 8
      description: 'Generated: CTF + 4 digits from the sequence, so 7 characters'
    rank:
      type: integer
      description: Position on the leaderboard
    reason:
      type: string
      minLength: 0
      maxLength: 255
      description: Shown to the team
    reasonCode:
      type: string
      minLength: 0
      maxLength: 2
      description: Reason code
      example: '00'
    regCode:
      type: string
      minLength: 0
      maxLength: 32
      description: Registration code; admin only
    regFromTS:
      type: string
      minLength: 0
      maxLength: 26
      description: Registration opens
      example: 2026-01-01-00.00.00.000000
    regToTS:
      type: string
      minLength: 0
      maxLength: 26
      description: Registration closes
      example: 2026-01-01-00.00.00.000000
    registrationID:
      type: integer
      description: Registration ID; the same value as playerID
    registrationOpen:
      type: string
      minLength: 0
      maxLength: 1
      description: Y or N
    registrationStatus:
      type: string
      minLength: 0
      maxLength: 1
      description: P pending, R ready, A active, F failed, V revoked, X deleted
    reqChallengeID:
      type: integer
      description: Required challenge
    retCode:
      type: string
      minLength: 0
      maxLength: 2
      description: Return code
      example: '00'
    retryCount:
      type: integer
      description: Retries (A6)
    reverseReason:
      type: string
      minLength: 0
      maxLength: 255
      description: Why
    reversedBy:
      type: string
      minLength: 0
      maxLength: 8
      description: Admin who reversed the solve
    reversedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: When
      example: 2026-01-01-00.00.00.000000
    role:
      type: string
      minLength: 0
      maxLength: 1
      description: A admin, P player, from the FACILITY check
    score:
      type: integer
      description: Solve values + awards - hint costs; can be negative
    scoreType:
      type: string
      minLength: 0
      maxLength: 1
      description: S static, D dynamic
    solveCount:
      type: integer
      description: Number of solves
    solvedBy:
      type: string
      minLength: 0
      maxLength: 30
      description: Display name of the solver
    solvedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Solve time
      example: 2026-01-01-00.00.00.000000
    sortOrder:
      type: integer
      description: Display order
    startTS:
      type: string
      minLength: 0
      maxLength: 26
      description: Start
      example: 2026-01-01-00.00.00.000000
    submissionID:
      type: integer
      description: Key
    submittedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Submitted
      example: 2026-01-01-00.00.00.000000
    submittedText:
      type: string
      minLength: 0
      maxLength: 255
      description: After trimming; admin only
    tabKey:
      type: string
      minLength: 0
      maxLength: 8
      description: Key in the list
    tabValue:
      type: string
      minLength: 0
      maxLength: 255
      description: Value or description
    tableID:
      type: string
      minLength: 0
      maxLength: 8
      description: List name
    teamID:
      type: integer
      description: Key
    teamName:
      type: string
      minLength: 0
      maxLength: 30
      description: Name as typed
    token:
      type: string
      minLength: 0
      maxLength: 1024
      description: Access token
    updatedBy:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid (or batch userid)
    updatedDate:
      type: string
      minLength: 0
      maxLength: 26
      description: Set by DB2
      example: 2026-01-01-00.00.00.000000
    username:
      type: string
      minLength: 0
      maxLength: 8
      description: RACF userid
    verifierPgm:
      type: string
      minLength: 0
      maxLength: 8
      description: For live verification later; NULL in v1
    ShortResponse:
      type: object
      properties:
        retCode:
          $ref: '#/components/schemas/retCode'
        reasonCode:
          $ref: '#/components/schemas/reasonCode'
        infoMessage:
          $ref: '#/components/schemas/infoMessage'
