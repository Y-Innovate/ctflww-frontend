openapi: 3.2.0
info:
  version: 1.0.0
  title: CTF API
  description: |
    Capture The Flag on the mainframe: events, challenges, flags, teams and leaderboards.
    Tags give the access level: public (no token), player, admin.
servers:
- url: https://<host>:<port>/ctf/API/v1
security:
- bearerAuth: []
tags:
- name: public
  description: No token; runs under the CICS default userid
- name: player
  description: Signed-in player
- name: admin
  description: Entra admin; FACILITY check in COBOL
paths:
  /token:
    summary: token
    post:
      summary: Sign in with RACF userid and passphrase
      operationId: newAccessToken
      tags:
      - public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccessTokenRequest'
      responses:
        '201':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortResponse'
        default:
          description: Unexpected error
  /events:
    summary: events
    get:
      summary: List published and closed events
      operationId: listEvents
      tags:
      - public
      security: []
      parameters:
      - name: eventID_since
        in: query
        description: 'Paging: continue after this value'
        required: false
        schema:
          $ref: '#/components/schemas/eventID'
      responses:
        '200':
          description: Successful
